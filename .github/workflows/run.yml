name: Generate PPT
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: pip install python-pptx
      - name: Run script
        run: python make_pet_raw_ppt.py
      - name: Upload ppt artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-ppt
          path: "*.pptx"
